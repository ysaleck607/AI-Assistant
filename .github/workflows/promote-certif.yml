name: Promote release candidate to CERTIF

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Optional candidate name; defaults to the latest active rc-* artifact
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-certif
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  CERTIF_RESOURCE_GROUP: ${{ vars.AZURE_CERTIF_RESOURCE_GROUP }}
  SHARED_RESOURCE_GROUP: ${{ vars.AZURE_SHARED_RESOURCE_GROUP }}
  NAME_SUFFIX: ${{ vars.AZURE_NAME_SUFFIX }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  CERTIF_PUBLIC_ORIGIN: https://assistant-certif.onpremia.ca

jobs:
  promote:
    name: Promote release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: certif

    steps:
      - name: Checkout deployment safeguards
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Microsoft 365 consent configuration
        run: deploy/infra/verify-microsoft365-consent-config.sh certif

      - name: Download release candidate manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          if [ -n "$REQUESTED_RELEASE_CANDIDATE" ] \
            && ! printf '%s' "$REQUESTED_RELEASE_CANDIDATE" | grep -Eq '^rc-[0-9A-Za-z._-]+$'; then
            echo "release_candidate must start with rc-." >&2
            exit 1
          fi

          ARTIFACT="$(gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            | jq -c --arg requested "$REQUESTED_RELEASE_CANDIDATE" \
              '[.[].artifacts[]
                | select(.expired == false)
                | select(if $requested == "" then (.name | startswith("rc-")) else .name == $requested end)]
              | sort_by(.created_at)
              | last // empty')"

          ARTIFACT_ID="$(printf '%s' "$ARTIFACT" | jq -r '.id // empty')"
          RELEASE_CANDIDATE="$(printf '%s' "$ARTIFACT" | jq -r '.name // empty')"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No matching active release candidate artifact was found." >&2
            exit 1
          fi

          mkdir -p /tmp/release-candidate
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/release-candidate/artifact.zip
          unzip -q /tmp/release-candidate/artifact.zip -d /tmp/release-candidate

          MANIFEST="/tmp/release-candidate/${RELEASE_CANDIDATE}.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "The release candidate manifest is missing from the artifact." >&2
            exit 1
          fi

          if ! jq -e --arg releaseCandidate "$RELEASE_CANDIDATE" '
            .schemaVersion == 2
            and .releaseCandidate == $releaseCandidate
            and .sourceEnvironment == "acr"
            and (.sourceCommits.backend | test("^[0-9a-f]{40}$"))
            and (.sourceCommits.spa | test("^[0-9a-f]{40}$"))
            and (.images | keys == ["api", "bff", "migrations", "spa", "worker"])
          ' "$MANIFEST" >/dev/null; then
            echo "The release candidate manifest contract is invalid." >&2
            exit 1
          fi

          API_IMAGE="$(jq -r '.images.api' "$MANIFEST")"
          BFF_IMAGE="$(jq -r '.images.bff' "$MANIFEST")"
          WORKER_IMAGE="$(jq -r '.images.worker' "$MANIFEST")"
          MIGRATIONS_IMAGE="$(jq -r '.images.migrations' "$MANIFEST")"
          SPA_IMAGE="$(jq -r '.images.spa' "$MANIFEST")"

          validate_image() {
            image="$1"
            repository="$2"
            if ! printf '%s' "$image" | grep -Eq "^${ACR_NAME}\\.azurecr\\.io/${repository}@sha256:[0-9a-f]{64}$"; then
              echo "The release candidate contains an invalid immutable ${repository} image reference." >&2
              exit 1
            fi
          }

          validate_image "$API_IMAGE" assistant-api
          validate_image "$BFF_IMAGE" assistant-bff
          validate_image "$WORKER_IMAGE" assistant-worker
          validate_image "$MIGRATIONS_IMAGE" assistant-migrations
          validate_image "$SPA_IMAGE" assistant-spa

          {
            echo "API_IMAGE=${API_IMAGE}"
            echo "BFF_IMAGE=${BFF_IMAGE}"
            echo "WORKER_IMAGE=${WORKER_IMAGE}"
            echo "MIGRATIONS_IMAGE=${MIGRATIONS_IMAGE}"
            echo "SPA_IMAGE=${SPA_IMAGE}"
            echo "RELEASE_CANDIDATE=${RELEASE_CANDIDATE}"
            echo "RELEASE_CANDIDATE_MANIFEST=${MANIFEST}"
          } >> "$GITHUB_ENV"

      - name: Verify images in ACR
        env:
          API_IMAGE: ${{ env.API_IMAGE }}
          BFF_IMAGE: ${{ env.BFF_IMAGE }}
          WORKER_IMAGE: ${{ env.WORKER_IMAGE }}
          MIGRATIONS_IMAGE: ${{ env.MIGRATIONS_IMAGE }}
          SPA_IMAGE: ${{ env.SPA_IMAGE }}
        run: |
          for image in "$API_IMAGE" "$BFF_IMAGE" "$WORKER_IMAGE" "$MIGRATIONS_IMAGE" "$SPA_IMAGE"; do
            REPOSITORY="${image#${ACR_NAME}.azurecr.io/}"
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$REPOSITORY" \
              --only-show-errors >/dev/null
          done

      - name: Synchronize Azure AI Search key
        run: deploy/infra/refresh-azure-search-key.sh \
          "$CERTIF_RESOURCE_GROUP" certif "$NAME_SUFFIX" "$SHARED_RESOURCE_GROUP"

      - name: Run CERTIF Flyway job
        run: |
          az containerapp job update \
            --name caj-assistant-mig-certif-p \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$MIGRATIONS_IMAGE"

          EXECUTION_NAME="$(az containerapp job start \
            --name caj-assistant-mig-certif-p \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query name --output tsv)"

          for attempt in $(seq 1 60); do
            STATUS="$(az containerapp job execution show \
              --name caj-assistant-mig-certif-p \
              --job-execution-name "$EXECUTION_NAME" \
              --resource-group "$CERTIF_RESOURCE_GROUP" \
              --query properties.status --output tsv)"
            if [ "$STATUS" = "Succeeded" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              exit 1
            fi
            sleep 10
          done

          echo "Flyway did not finish within 10 minutes." >&2
          exit 1

      - name: Deploy CERTIF release candidate for readiness checks
        run: |
          az containerapp update \
            --name ca-assistant-api-certif-p \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --container-name api \
            --image "$API_IMAGE" \
            --min-replicas 1
          az containerapp update \
            --name ca-assistant-worker-certif-p \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --container-name worker \
            --image "$WORKER_IMAGE" \
            --min-replicas 0
          az containerapp update \
            --name ca-assistant-spa-certif-p \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --container-name spa \
            --image "$SPA_IMAGE" \
            --min-replicas 1
          az containerapp update \
            --name ca-assistant-spa-certif-p \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --container-name bff \
            --image "$BFF_IMAGE" \
            --min-replicas 1

      - name: Verify deployed CERTIF revisions
        run: |
          deploy/infra/verify-containerapp-revision.sh \
            "$CERTIF_RESOURCE_GROUP" \
            ca-assistant-api-certif-p \
            "{\"api\":\"$API_IMAGE\"}"
          deploy/infra/verify-containerapp-revision.sh \
            "$CERTIF_RESOURCE_GROUP" \
            ca-assistant-spa-certif-p \
            "{\"spa\":\"$SPA_IMAGE\",\"bff\":\"$BFF_IMAGE\"}"

      - name: Purge Front Door cache
        run: deploy/infra/purge-front-door-cache.sh "$CERTIF_RESOURCE_GROUP" certif

      - name: Verify CERTIF readiness
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "${CERTIF_PUBLIC_ORIGIN}/health/live"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "${CERTIF_PUBLIC_ORIGIN}/health/api-ready"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "${CERTIF_PUBLIC_ORIGIN}/"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "${CERTIF_PUBLIC_ORIGIN}/assets/config/config.json"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "${CERTIF_PUBLIC_ORIGIN}/bff/session"

      - name: Publish certified release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certified-${{ env.RELEASE_CANDIDATE }}
          path: ${{ env.RELEASE_CANDIDATE_MANIFEST }}
          if-no-files-found: error
          retention-days: 90
