name: Promote release candidate to CERTIF

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Optional candidate name; defaults to the latest active rc-* artifact
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-certif
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  CERTIF_RESOURCE_GROUP: ${{ vars.AZURE_CERTIF_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  promote:
    name: Promote release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: certif

    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download release candidate manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          if [ -n "$REQUESTED_RELEASE_CANDIDATE" ] \
            && ! printf '%s' "$REQUESTED_RELEASE_CANDIDATE" | grep -Eq '^rc-[0-9A-Za-z._-]+$'; then
            echo "release_candidate must start with rc-." >&2
            exit 1
          fi

          ARTIFACT="$(gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            | jq -c --arg requested "$REQUESTED_RELEASE_CANDIDATE" \
              '[.[].artifacts[]
                | select(.expired == false)
                | select(if $requested == "" then (.name | startswith("rc-")) else .name == $requested end)]
              | sort_by(.created_at)
              | last // empty')"

          ARTIFACT_ID="$(printf '%s' "$ARTIFACT" | jq -r '.id // empty')"
          RELEASE_CANDIDATE="$(printf '%s' "$ARTIFACT" | jq -r '.name // empty')"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No matching active release candidate artifact was found." >&2
            exit 1
          fi

          mkdir -p /tmp/release-candidate
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/release-candidate/artifact.zip
          unzip -q /tmp/release-candidate/artifact.zip -d /tmp/release-candidate

          MANIFEST="/tmp/release-candidate/${RELEASE_CANDIDATE}.yml"
          if [ ! -f "$MANIFEST" ]; then
            echo "The release candidate manifest is missing from the artifact." >&2
            exit 1
          fi

          API_IMAGE="$(awk '$1 == "api:" {print $2}' "$MANIFEST")"
          WORKER_IMAGE="$(awk '$1 == "worker:" {print $2}' "$MANIFEST")"
          MIGRATIONS_IMAGE="$(awk '$1 == "migrations:" {print $2}' "$MANIFEST")"
          SPA_IMAGE="$(awk '$1 == "spa:" {print $2}' "$MANIFEST")"

          for image in "$API_IMAGE" "$WORKER_IMAGE" "$MIGRATIONS_IMAGE" "$SPA_IMAGE"; do
            if ! printf '%s' "$image" | grep -Eq "^${ACR_NAME}\\.azurecr\\.io/(assistant-api|assistant-worker|assistant-migrations|assistant-spa)@sha256:[0-9a-f]{64}$"; then
              echo "The release candidate contains an invalid immutable image reference." >&2
              exit 1
            fi
          done

          {
            echo "API_IMAGE=${API_IMAGE}"
            echo "WORKER_IMAGE=${WORKER_IMAGE}"
            echo "MIGRATIONS_IMAGE=${MIGRATIONS_IMAGE}"
            echo "SPA_IMAGE=${SPA_IMAGE}"
            echo "RELEASE_CANDIDATE=${RELEASE_CANDIDATE}"
          } >> "$GITHUB_ENV"

      - name: Verify images in ACR
        env:
          API_IMAGE: ${{ env.API_IMAGE }}
          WORKER_IMAGE: ${{ env.WORKER_IMAGE }}
          MIGRATIONS_IMAGE: ${{ env.MIGRATIONS_IMAGE }}
          SPA_IMAGE: ${{ env.SPA_IMAGE }}
        run: |
          for image in "$API_IMAGE" "$WORKER_IMAGE" "$MIGRATIONS_IMAGE" "$SPA_IMAGE"; do
            REPOSITORY="${image#${ACR_NAME}.azurecr.io/}"
            az acr repository show \
              --name "$ACR_NAME" \
              --image "$REPOSITORY" \
              --only-show-errors >/dev/null
          done

      - name: Run CERTIF Flyway job
        run: |
          az containerapp job update \
            --name caj-assistant-migrations-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$MIGRATIONS_IMAGE"

          EXECUTION_NAME="$(az containerapp job start \
            --name caj-assistant-migrations-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query name --output tsv)"

          for attempt in $(seq 1 60); do
            STATUS="$(az containerapp job execution show \
              --name caj-assistant-migrations-certif \
              --job-execution-name "$EXECUTION_NAME" \
              --resource-group "$CERTIF_RESOURCE_GROUP" \
              --query properties.status --output tsv)"
            if [ "$STATUS" = "Succeeded" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              exit 1
            fi
            sleep 10
          done

          echo "Flyway did not finish within 10 minutes." >&2
          exit 1

      - name: Deploy CERTIF release candidate for readiness checks
        run: |
          az containerapp update \
            --name ca-assistant-api-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$API_IMAGE" \
            --min-replicas 1
          az containerapp update \
            --name ca-assistant-worker-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$WORKER_IMAGE" \
            --min-replicas 0
          az containerapp update \
            --name ca-assistant-spa-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --image "$SPA_IMAGE" \
            --min-replicas 1

      - name: Verify CERTIF readiness
        run: |
          API_FQDN="$(az containerapp show \
            --name ca-assistant-api-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${API_FQDN}/health/live"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${API_FQDN}/health/ready"

          SPA_FQDN="$(az containerapp show \
            --name ca-assistant-spa-certif \
            --resource-group "$CERTIF_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${SPA_FQDN}/"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${SPA_FQDN}/assets/config/config.json"
