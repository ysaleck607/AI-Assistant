name: RAG evaluation certification

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rag-evaluation-certification-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  evaluate:
    name: Evaluate the Foundry agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rag-evaluation-certification

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore dependencies
        run: dotnet restore AssistantCore.RagEvaluation/AssistantCore.RagEvaluation.csproj

      - name: Build evaluation runner
        run: >-
          dotnet build AssistantCore.RagEvaluation/AssistantCore.RagEvaluation.csproj
          --configuration Release --no-restore

      - name: Run Foundry RAG evaluation
        run: >-
          dotnet run --project AssistantCore.RagEvaluation/AssistantCore.RagEvaluation.csproj
          --configuration Release --no-build --
          --mode model
          --dataset docs/recherche/rag-agentique/evaluation-cases.json
          --output artifacts/rag-evaluation

      - name: Upload RAG evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-evaluation-foundry-agent
          path: artifacts/rag-evaluation
          if-no-files-found: warn
