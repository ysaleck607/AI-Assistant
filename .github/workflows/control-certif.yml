name: Start or stop CERTIF

on:
  workflow_dispatch:
    inputs:
      action:
        description: Desired state
        required: true
        type: choice
        options: [start, stop]
      scope:
        description: Control only the worker or the complete environment
        required: true
        default: all
        type: choice
        options: [all, worker]

permissions:
  contents: read
  id-token: write

concurrency:
  group: control-certif
  cancel-in-progress: true

env:
  AZURE_CORE_OUTPUT: none
  RESOURCE_GROUP: ${{ vars.AZURE_CERTIF_RESOURCE_GROUP }}

jobs:
  control:
    name: ${{ inputs.action }} CERTIF (${{ inputs.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: certif

    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Control worker
        run: |
          if [ "${{ inputs.action }}" = "start" ]; then
            MIN_REPLICAS=1
            EXTRA_ARGUMENTS=(--set-env-vars "WorkerAutoStopToken=control-${{ github.run_id }}-${{ github.run_attempt }}")
          else
            MIN_REPLICAS=0
            EXTRA_ARGUMENTS=()
          fi

          az containerapp update \
            --name ca-assistant-worker-certif \
            --resource-group "$RESOURCE_GROUP" \
            "${EXTRA_ARGUMENTS[@]}" \
            --min-replicas "$MIN_REPLICAS"

      - name: Control API and public SPA
        if: ${{ inputs.scope == 'all' }}
        run: |
          for app in ca-assistant-api-certif ca-assistant-spa-certif; do
            if [ "${{ inputs.action }}" = "start" ]; then
              TARGET_PORT=8080
              INGRESS_TYPE=external
              if [ "$app" = "ca-assistant-api-certif" ]; then
                INGRESS_TYPE=internal
              fi
              az containerapp ingress enable \
                --name "$app" \
                --resource-group "$RESOURCE_GROUP" \
                --type "$INGRESS_TYPE" \
                --target-port "$TARGET_PORT" \
                --transport auto
              az containerapp update \
                --name "$app" \
                --resource-group "$RESOURCE_GROUP" \
                --min-replicas 1
            else
              az containerapp ingress disable \
                --name "$app" \
                --resource-group "$RESOURCE_GROUP"
              az containerapp update \
                --name "$app" \
                --resource-group "$RESOURCE_GROUP" \
                --min-replicas 0
            fi
          done

  auto-stop-worker:
    name: Stop CERTIF worker after 30 minutes
    needs: control
    if: ${{ inputs.action == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: certif

    steps:
      - name: Wait before stopping worker
        run: sleep 1800

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stop CERTIF worker
        run: |
          EXPECTED_TOKEN="control-${{ github.run_id }}-${{ github.run_attempt }}"
          CURRENT_TOKEN="$(az containerapp show \
            --name ca-assistant-worker-certif \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[?name == 'worker'] | [0].env[?name == 'WorkerAutoStopToken'].value | [0]" \
            --output tsv)"

          if [ "$CURRENT_TOKEN" != "$EXPECTED_TOKEN" ]; then
            echo "The CERTIF worker was restarted more recently; skipping this stale stop."
            exit 0
          fi

          az containerapp update \
            --name ca-assistant-worker-certif \
            --resource-group "$RESOURCE_GROUP" \
            --min-replicas 0
