name: Create release candidate

on:
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: Optional backend SHA tag; defaults to the latest published tag in ACR
        required: false
        type: string
      spa_image_tag:
        description: Optional SPA SHA tag; defaults to the latest published tag in ACR
        required: false
        type: string
      release_candidate:
        description: Optional candidate name; generated automatically when empty
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CORE_OUTPUT: none
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  manifest:
    name: Create immutable manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: certif

    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve and validate release candidate inputs
        id: release
        env:
          REQUESTED_BACKEND_TAG: ${{ inputs.backend_image_tag }}
          REQUESTED_SPA_TAG: ${{ inputs.spa_image_tag }}
          REQUESTED_RC_NAME: ${{ inputs.release_candidate }}
        run: |
          BACKEND_TAG="$REQUESTED_BACKEND_TAG"
          SPA_TAG="$REQUESTED_SPA_TAG"
          if [ -z "$BACKEND_TAG" ]; then
            BACKEND_TAG="$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository assistant-api \
              --orderby time_desc \
              --output tsv \
              | grep -m 1 -E '^sha-[0-9a-f]{40}$' || true)"
          fi
          if [ -z "$SPA_TAG" ]; then
            SPA_TAG="$(az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository assistant-spa \
              --orderby time_desc \
              --output tsv \
              | grep -m 1 -E '^sha-[0-9a-f]{40}$' || true)"
          fi
          RC_NAME="${REQUESTED_RC_NAME:-rc-$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}}"

          if [ -z "$BACKEND_TAG" ] || [ -z "$SPA_TAG" ]; then
            echo "No published SHA tag was found in ACR for the backend or SPA." >&2
            exit 1
          fi

          for tag in "$BACKEND_TAG" "$SPA_TAG"; do
            if ! printf '%s' "$tag" | grep -Eq '^sha-[0-9a-f]{40}$'; then
              echo "Every image tag must contain a complete Git SHA." >&2
              exit 1
            fi
          done
          if ! printf '%s' "$RC_NAME" | grep -Eq '^rc-[0-9A-Za-z._-]+$'; then
            echo "release_candidate must start with rc-." >&2
            exit 1
          fi

          az acr repository show --name "$ACR_NAME" --image "assistant-api:${BACKEND_TAG}" --only-show-errors >/dev/null
          az acr repository show --name "$ACR_NAME" --image "assistant-worker:${BACKEND_TAG}" --only-show-errors >/dev/null
          az acr repository show --name "$ACR_NAME" --image "assistant-migrations:${BACKEND_TAG}" --only-show-errors >/dev/null
          az acr repository show --name "$ACR_NAME" --image "assistant-spa:${SPA_TAG}" --only-show-errors >/dev/null

          {
            echo "backend_tag=${BACKEND_TAG}"
            echo "spa_tag=${SPA_TAG}"
            echo "name=${RC_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve digests and write manifest
        env:
          BACKEND_TAG: ${{ steps.release.outputs.backend_tag }}
          SPA_TAG: ${{ steps.release.outputs.spa_tag }}
          RC_NAME: ${{ steps.release.outputs.name }}
        run: |
          mkdir -p release-candidate
          API_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "assistant-api:${BACKEND_TAG}" --query digest --output tsv)"
          WORKER_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "assistant-worker:${BACKEND_TAG}" --query digest --output tsv)"
          MIGRATIONS_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "assistant-migrations:${BACKEND_TAG}" --query digest --output tsv)"
          SPA_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "assistant-spa:${SPA_TAG}" --query digest --output tsv)"

          printf '%s\n' \
            'schemaVersion: 1' \
            "releaseCandidate: ${RC_NAME}" \
            "createdAtUtc: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            'sourceEnvironment: acr' \
            'images:' \
            "  api: ${ACR_NAME}.azurecr.io/assistant-api@${API_DIGEST}" \
            "  worker: ${ACR_NAME}.azurecr.io/assistant-worker@${WORKER_DIGEST}" \
            "  migrations: ${ACR_NAME}.azurecr.io/assistant-migrations@${MIGRATIONS_DIGEST}" \
            "  spa: ${ACR_NAME}.azurecr.io/assistant-spa@${SPA_DIGEST}" \
            > "release-candidate/${RC_NAME}.yml"

      - name: Upload release candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.name }}
          path: release-candidate/${{ steps.release.outputs.name }}.yml
          if-no-files-found: error
          retention-days: 90
